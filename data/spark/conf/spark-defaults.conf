spark.sql.extensions                             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.defaultCatalog                         minilake
spark.sql.catalog.minilake                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.minilake.type                  rest
spark.sql.catalog.minilake.uri                   http://minilake:8181
spark.sql.catalog.minilake.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.minilake.warehouse             s3://warehouse/wh/
spark.sql.catalog.minilake.s3.endpoint           http://rustfs:9000
spark.sql.catalog.minilake.s3.path-style-access  true

spark.sql.catalogImplementation        in-memory

spark.eventLog.enabled                 true
spark.eventLog.dir                     /home/iceberg/spark-events
spark.history.fs.logDirectory          /home/iceberg/spark-events
