services:
  # --- Fixes host directory permissions automatically ---
  rustfs_init:
    image: alpine:latest
    user: "root"
    volumes:
      - ./data/rustfs/data:/fix_data
      - ./data/rustfs/logs:/fix_logs
    networks:
      net:
    command: chown -R 10001:10001 /fix_data /fix_logs
    
  # --- RustFS Object Storage ---
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
    volumes:
      - ./data/rustfs-data:/data
    networks:
      net:
    # command: server /data

  # --- Minilake ---
  minilake:
    image: datalearns247/minilake:1.07.24
    container_name: minilake
    networks:
      net:
    depends_on:
      - rustfs
    volumes:
      - ./notebooks:/home/iceberg/notebooks
      - ./data/metastore:/home/iceberg/metastore
      - ./data/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3a://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://rustfs:9000
      - CATALOG_URI=jdbc:sqlite:file:/home/iceberg/metastore/iceberg.db
      - CATALOG_S3_PATH__STYLE__ACCESS=true
    ports:
      - 8888:8888   # jupyter notebook
      - 8080:8080   # Spark master web UI
      - 10000:10000 # Spark thrift server
      - 10001:10001 
    entrypoint: >
      /bin/sh -c "
      ./entrypoint.sh;
      "
  
networks:
  net:
  #  driver: bridge
